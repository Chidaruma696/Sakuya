    errores:
      sin_decision: 'the rule must end in (allow), (to-review "why") or (reject "why"), and it ended in %{valor}'
      motivo: to-review and reject need the reason, as a string or a keyword
      motivo_desconocido: 'unknown reason :%{motivo}; the ones I know: :%{motivos}'
    versiones: Versions
    vigente: current
    restaurar: Go back to this one
    sin_versiones: 'No versions yet: the built-in rule is used.'
    avisos:
      guardado: Rule saved.
      restaurado: Went back to the version from %{fecha}.
    caso: Test case
    lee: What it reads (in pesos)
    contesta: What it answers
    ejemplo: Example
  regla_recepcion:
    titulo: Receipts in Lisp
    ayuda: Before the supplier's goods enter the stock, this rule looks at what arrives, from whom and with which papers, and decides whether it comes in, goes to review or is stopped. Out of the box it stops nothing. Test saves nothing.
    fallo: 'The receipts rule failed and the built-in one decided: %{error}'
    motivos: {}
    caso:
      llegan: What arrives (CODE quantity, …)
      remision: Delivery note
      facturada: Comes with an invoice
      autorizado: Received by someone allowed to force receipts
    veredictos:
      allow: It comes in
      review: It comes in and goes to review
      reject: It is stopped
    funciones:
      supplier: the supplier name
      lines: how many lines
      products: the list of codes
      quantity_of: '(quantity-of "CODE"): how much of that product arrives'
      value: what it is worth at list price
      remission: 'the written delivery note ("" if none)'
      invoiced: whether it is linked to an invoice
      authorized: whether the person receiving may force receipts
    allow: it comes in
    to_review: it comes in and goes to review
    reject: it does not come in and the attempt is reported
    nucleo: Someone allowed to force receipts can always receive; for them, stopping means review.
  regla_factura:
    factura_no_existe: 'there is no invoice %{folio}'
    titulo: Invoices in Lisp
    ayuda: Before a supplier invoice is recorded, this rule compares what is invoiced with what the linked receipts brought, and decides whether it is recorded, goes to review or is stopped. Test saves nothing.
    fallo: 'The invoice rule failed and the built-in one decided: %{error}'
    motivos:
      over_received: 'invoicing more than received (%{detalle})'
    caso:
      factura: Or a real invoice (number)
      factura_ayuda: Compares it with the receipts linked to it, as when it was recorded.
      productos_de_mas: Products in excess
      valor_de_mas: Value of the excess
      total: Invoice total
      candado_puesto: The lock in Settings › Purchases is on.
      candado_quitado: The lock in Settings › Purchases is off.
      autorizado: Invoiced by someone allowed to exceed
    veredictos:
      allow: It is recorded
      review: It is recorded and goes to review
      reject: It is stopped
    funciones:
      excess_items: how many products come in excess
      excess_value: what the excess is worth
      total: the invoice total
      receipts: how many receipts are linked
      supplier: the supplier name
      lock: whether the lock in Settings › Purchases is on
      authorized: whether the person invoicing may exceed
    allow: it is recorded
    to_review: asks for a reason and goes to review
    reject: it is not recorded and the attempt is reported
    nucleo: Someone allowed to exceed can always record it; for them, stopping means review with a reason.
  regla_movimiento:
    titulo: Stock in Lisp
    ayuda: Before a loose entry, an adjustment or waste, this rule looks at what, how much and why, and decides whether it moves, goes to review or is stopped. Sakuya requires a reason and enough stock before asking. Test saves nothing.
    fallo: 'The stock rule failed and the built-in one decided: %{error}'
    motivos:
      needs_permission: permission to adjust is needed
    caso:
      tipo: Movement
      motivo_ejemplo: went bad
      autorizado: Done by someone allowed to adjust
    veredictos:
      allow: It moves
      review: It moves and goes to review
      reject: It is stopped
    funciones:
      kind: ':in entry, :adjust-in adjustment (+), :adjust-out adjustment (−), :waste waste'
      quantity: the quantity
      stock: what there is before moving it
      product: the product code
      value: what it is worth at list price
      reason: the written reason
      authorized: whether the person may adjust
    allow: it moves
    to_review: it moves and goes to review
    reject: it does not move and the attempt is reported
    nucleo: Someone allowed to adjust can always do it; for them, stopping means review.
  regla_retiro:
    titulo: Withdrawals in Lisp
    ayuda: Before cash leaves the drawer, this rule looks at how much and why, and decides whether it goes out, goes to review or is stopped. Sakuya requires a reason and enough cash before asking. Test saves nothing.
    fallo: 'The withdrawal rule failed and the built-in one decided: %{error}'
    motivos:
      needs_permission: permission to withdraw is needed
    caso:
      monto: Amount
      en_gaveta: In drawer
      motivo: Reason
      motivo_ejemplo: safe
      autorizado: Withdrawn by someone allowed to withdraw
    veredictos:
      allow: It goes out
      review: It goes out and goes to review
      reject: It is stopped
    funciones:
      amount: what goes out
      cash: what the drawer has
      withdrawn: already withdrawn in the session
      cash_limit: the branch cash limit
      reason: the written reason
      authorized: whether the person withdrawing may withdraw
    allow: it goes out
    to_review: it goes out and goes to review
    reject: it does not go out and the attempt is reported
    nucleo: Someone allowed to withdraw can always do it; for them, stopping means review.
  regla_credito:
    titulo: Credit in Lisp
    ayuda: When a sale goes on a customer's account, this rule looks at the account (balance, limit, overdue, last payment) and decides whether to give credit, send it to review or stop it. Out of the box nobody gets credit. Test saves nothing.
    fallo: 'The credit rule failed and the built-in one decided: %{error}'
    motivos:
      no_credit: this business does not sell on account
      over_limit: 'this sale takes them over their limit (owes %{saldo}, limit %{limite})'
    caso:
      cliente: Customer
      inventado: — a made-up one —
      monto: On account
      saldo: Owes
      limite: Limit
      cuenta: 'Owes %{saldo} · limit %{limite}'
      autorizado: Charged by someone allowed to force credit
    veredictos:
      allow: Credit given
      review: Credit given and goes to review
      reject: It is stopped
    funciones:
      amount: what goes on account
      total: the sale total
      balance: what they owe before this sale
      limit: their credit limit
      overdue: '(overdue 30): what they owe from more than 30 days ago'
      days_since_payment: days since their last payment (-1 if never)
      customer: their name
      authorized: whether the person charging may force credit
    allow: credit is given
    to_review: credit is given and goes to review
    reject: no credit and the attempt is reported
    nucleo: Someone allowed to force credit can always do it; for them, stopping means review.
  regla_venta:
    titulo: Sales in Lisp
    ayuda: With the whole ticket, right before charging, this rule looks at the sale (total, products, payment methods, time) and decides whether it is charged, goes to review or is stopped. Out of the box it stops nothing; prices are judged by their own rule. Test saves nothing.
    fallo: 'The sales rule failed and the built-in one decided: %{error}'
    forma: 'paid-with takes a payment method: :%{formas}'
    motivos: {}
    caso:
      claves: Codes (comma separated)
      total: Total
      forma: Payment method
      hora: Hour
      autorizado: Charged by someone allowed to force sales
    veredictos:
      allow: It is charged
      review: It is charged and goes to review
      reject: It is stopped
    funciones:
      total: the total
      change: the change
      paid_with: '(paid-with :cash), :transfer or :deposit: what was paid that way'
      lines: how many lines
      products: the list of codes
      quantity_of: '(quantity-of "CODE"): how much of that product'
      hour: the hour (0-23)
      weekday: the day (1 Monday … 7 Sunday)
      authorized: whether the person charging may force sales
    allow: it is charged
    to_review: it is charged and goes to review
    reject: it is not charged and the attempt is reported
    nucleo: Someone allowed to force sales can always charge; for them, stopping means review.
  regla_precio:
    venta_no_existe: 'there is no sale %{folio} at this branch'
    titulo: Price in Lisp
    ayuda: Every line charged at the till goes through this rule, which looks at the price and decides whether it is charged, goes to review or is stopped. No rule can cross the floor from Settings › Till. Test saves nothing.
    sin_productos: there are no products with a price to test with
    fallo: 'The price rule failed and the built-in one decided: %{error}'
    motivos:
      below_price: below the regular price
    caso:
      venta: Or a real sale (number)
      venta_ayuda: Goes through its lines as they were charged; the regular price comes from the list price back then and today's promotions.
      producto: Product code
      cantidad: Quantity
      precio: Price charged
      toca: 'Regular: %{regular} (list %{catalogo})'
      autorizado: Charged by someone allowed to lower prices
    veredictos:
      allow: It is charged
      review: It is charged and goes to review
      reject: It is stopped
    funciones:
      price: what is charged
      list_price: the branch list price
      regular_price: the regular price (promotion or list)
      discount: how many percent below the regular price
      quantity: the quantity
      product: the product code
      authorized: whether the person charging may lower prices
    allow: it is charged
    to_review: it is charged and goes to review
    reject: it is not charged and the attempt is reported
    nucleo: Someone allowed to lower prices can always charge; for them, stopping means review.
  regla_corte:
    titulo: Cash closing in Lisp
    ayuda: When the session is closed, this rule looks at the count and decides whether it closes, goes to review or is stopped. Test saves nothing; each saved version stays in the list below.
    fallo: 'The cash count rule failed and the built-in one decided: %{error}'
    motivos:
      over_limit: the difference (%{diferencia}) exceeds the limit (%{tope})
    caso:
      esperado: Expected in drawer
      contado: Counted
      autorizado: Closed by someone allowed to accept differences
    veredictos:
      allow: It closes
      review: It closes and goes to review
      reject: It is stopped
    funciones:
      difference: counted − expected; negative = missing
      counted: what was counted
      expected: what should be there
      float: the float
      sales: session sales
      cash_sales: cash from sales
      returns: returns
      withdrawals: withdrawals
      limit: the limit from Settings › Till (0 = no limit)
      tickets: session tickets
      authorized: whether the person closing may accept differences
    allow: it closes
    to_review: asks for a reason and goes to review
    reject: stops it and reports the attempt
    nucleo: Someone allowed to accept differences can always close; for them, stopping means review.
  tablero:
    titulo: Dashboard in Lisp
    ayuda: The home dashboard is a program. Change which figures show and in what order, compute your own and pick the lists below. Trying doesn't save anything; every saved version stays in the list below.
    personalizar: Customize
    arreglar: Fix it
    error_html: 'Your dashboard has an error, so the default one is shown: %{error}'
    programa: Program
    probar: Try it
    guardar: Save
    vista_previa: Preview
    vista_previa_ayuda: With today's figures for your branch.
    versiones: Versions
    vigente: current
    restaurar: Restore
    sin_versiones: 'No versions yet: the default dashboard is used.'
    avisos:
      guardado: Dashboard saved.
      restaurado: Restored the version from %{fecha}.
    referencia:
      titulo: What you can write
      cifras: Built-in figures
      propias: Your own figures
      propias_ayuda: 'Every built-in figure can also be read as a function: (sales), (tickets)… Plus (days) and, by product code, (sold "CODE") and (sales-of "CODE"). The format goes last: :money, :number or :percent.'
      paneles: Lists
      paneles_ayuda: 'A number after it sets how many rows: (panel :top-products 5).'
      lenguaje: The language
      lenguaje_ayuda: You have let, if, cond, when, define, lambda, map, filter, reduce, +, -, *, /, round and comparisons. (when (> (returns) 0) (tile :returns)) shows a figure only when it matters. Money is in exact decimals.
    errores:
      sin_dashboard: the program has to end with (dashboard …)
      cifra_desconocida: there is no figure :%{cifra}; the built-in ones are :%{cifras}
      titulo: tile takes a built-in figure (:sales) or a title in quotes
      valor: "“%{titulo}” needs a value that is a number or text"
      formato: the format is one of :%{formatos}
      panel: there is no list :%{panel}; there are :%{paneles}
      limite: a list shows from 1 to 50 rows
      pieza: dashboard only takes (tile …) and (panel …), and got %{valor}
      clave: the product code goes in quotes
      producto: there is no product with code %{clave}
    muestra: Load sample data
    muestra_ayuda: Try it with made-up figures, to see the dashboard full even with no sales today. Nothing is touched.
    vista_previa_muestra: 'Made-up sample data: these are not your business’s sales.'
