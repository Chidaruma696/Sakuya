  withdrawal_rule:
    title: Withdrawals in Lisp
    help: Before cash leaves the drawer, this rule looks at how much and why, and decides whether it goes out, goes to review or is stopped. Sakuya requires a reason and enough cash before asking. Test saves nothing.
    failure: 'The withdrawal rule failed and the built-in one decided: %{error}'
    reasons:
      needs_permission: permission to withdraw is needed
    scenario:
      amount: Amount
      in_drawer: In drawer
      reason: Reason
      reason_example: safe
      authorized: Withdrawn by someone allowed to withdraw
    verdicts:
      allow: It goes out
      review: It goes out and goes to review
      reject: It is stopped
    functions:
      amount: what goes out
      cash: what the drawer has
      withdrawn: already withdrawn in the session
      cash_limit: the branch cash limit
      reason: the written reason
      authorized: whether the person withdrawing may withdraw
    allow: it goes out
    to_review: it goes out and goes to review
    reject: it does not go out and the attempt is reported
    core: Someone allowed to withdraw can always do it; for them, stopping means review.
  credit_rule:
    title: Credit in Lisp
    help: When a sale goes on a customer's account, this rule looks at the account (balance, limit, overdue, last payment) and decides whether to give credit, send it to review or stop it. Out of the box nobody gets credit. Test saves nothing.
    failure: 'The credit rule failed and the built-in one decided: %{error}'
    reasons:
      no_credit: this business does not sell on account
      over_limit: 'this sale takes them over their limit (owes %{balance}, limit %{limit})'
    scenario:
      customer: Customer
      made_up: — a made-up one —
      amount: On account
      balance: Owes
      limit: Limit
      account: 'Owes %{balance} · limit %{limit}'
      authorized: Charged by someone allowed to force credit
    verdicts:
      allow: Credit given
      review: Credit given and goes to review
      reject: It is stopped
    functions:
      amount: what goes on account
      total: the sale total
      balance: what they owe before this sale
      limit: their credit limit
      overdue: '(overdue 30): what they owe from more than 30 days ago'
      days_since_payment: days since their last payment (-1 if never)
      customer: their name
      authorized: whether the person charging may force credit
    allow: credit is given
    to_review: credit is given and goes to review
    reject: no credit and the attempt is reported
    core: Someone allowed to force credit can always do it; for them, stopping means review.
  sale_rule:
    title: Sales in Lisp
    help: With the whole ticket, right before charging, this rule looks at the sale (total, products, payment methods, time) and decides whether it is charged, goes to review or is stopped. Out of the box it stops nothing; prices are judged by their own rule. Test saves nothing.
    failure: 'The sales rule failed and the built-in one decided: %{error}'
    payment_method: 'paid-with takes a payment method: :%{payment_methods}'
    reasons: {}
    scenario:
      keys: Codes (comma separated)
      total: Total
      payment_method: Payment method
      hour: Hour
      authorized: Charged by someone allowed to force sales
    verdicts:
      allow: It is charged
      review: It is charged and goes to review
      reject: It is stopped
    functions:
      total: the total
      change: the change
      paid_with: '(paid-with :cash), :transfer or :deposit: what was paid that way'
      lines: how many lines
      products: the list of codes
      quantity_of: '(quantity-of "CODE"): how much of that product'
      hour: the hour (0-23)
      weekday: the day (1 Monday … 7 Sunday)
      authorized: whether the person charging may force sales
    allow: it is charged
    to_review: it is charged and goes to review
    reject: it is not charged and the attempt is reported
    core: Someone allowed to force sales can always charge; for them, stopping means review.
  price_rule:
    sale_not_found: 'there is no sale %{folio} at this branch'
    title: Price in Lisp
    help: Every line charged at the till goes through this rule, which looks at the price and decides whether it is charged, goes to review or is stopped. No rule can cross the floor from Settings › Till. Test saves nothing.
    no_products: there are no products with a price to test with
    failure: 'The price rule failed and the built-in one decided: %{error}'
    reasons:
      below_price: below the regular price
    scenario:
      sale: Or a real sale (number)
      sale_help: Goes through its lines as they were charged; the regular price comes from the list price back then and today's promotions.
      product: Product code
      quantity: Quantity
      price: Price charged
      regular: 'Regular: %{regular} (list %{catalog})'
      authorized: Charged by someone allowed to lower prices
    verdicts:
      allow: It is charged
      review: It is charged and goes to review
      reject: It is stopped
    functions:
      price: what is charged
      list_price: the branch list price
      regular_price: the regular price (promotion or list)
      discount: how many percent below the regular price
      quantity: the quantity
      product: the product code
      authorized: whether the person charging may lower prices
    allow: it is charged
    to_review: it is charged and goes to review
    reject: it is not charged and the attempt is reported
    core: Someone allowed to lower prices can always charge; for them, stopping means review.
  shift_rule:
    title: Cash closing in Lisp
    help: When the session is closed, this rule looks at the count and decides whether it closes, goes to review or is stopped. Test saves nothing; each saved version stays in the list below.
    failure: 'The cash count rule failed and the built-in one decided: %{error}'
    reasons:
      over_limit: the difference (%{difference}) exceeds the limit (%{cap})
    scenario:
      expected: Expected in drawer
      counted: Counted
      authorized: Closed by someone allowed to accept differences
    verdicts:
      allow: It closes
      review: It closes and goes to review
      reject: It is stopped
    functions:
      difference: counted − expected; negative = missing
      counted: what was counted
      expected: what should be there
      float: the float
      sales: session sales
      cash_sales: cash from sales
      returns: returns
      withdrawals: withdrawals
      limit: the limit from Settings › Till (0 = no limit)
      tickets: session tickets
      authorized: whether the person closing may accept differences
    allow: it closes
    to_review: asks for a reason and goes to review
    reject: stops it and reports the attempt
    core: Someone allowed to accept differences can always close; for them, stopping means review.
  dashboard:
    title: Dashboard in Lisp
