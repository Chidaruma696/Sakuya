  regla_movimiento:
    titulo: Inventario en Lisp
    ayuda: Antes de una entrada suelta, un ajuste o una merma, esta regla mira qué, cuánto y por qué, y decide si se mueve, si queda por revisar o si se frena. Que haya motivo y existencias lo exige Sakuya antes de preguntar. Probar no guarda nada.
